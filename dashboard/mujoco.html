<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuJoCo 仿真入口</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0e14;
  --surface: #12161f;
  --surface2: #1a1f2e;
  --surface3: #222938;
  --border: #2d3548;
  --text: #e8ecf4;
  --muted: #8892a4;
  --dim: #5a6579;
  --accent: #60a5fa;
  --done: #34d399;
  --next: #fbbf24;
  --planned: #6b7a96;
}
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 15%, rgba(96, 165, 250, 0.12), transparent 34%),
    radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.08), transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  background: rgba(18, 22, 31, 0.84);
  border-bottom: 1px solid rgba(45, 53, 72, 0.7);
  backdrop-filter: blur(12px);
}
.title-block { flex: 1; min-width: 0; }
h1 { font-size: 1.15rem; margin-bottom: 4px; }
.subtitle { color: var(--muted); font-size: 0.78rem; }
.back-link,
.version-select {
  border: 1px solid rgba(96, 165, 250, 0.45);
  background: rgba(96, 165, 250, 0.12);
  color: var(--text);
  border-radius: 6px;
  font-size: 0.78rem;
}
.back-link {
  text-decoration: none;
  padding: 8px 10px;
  color: var(--accent);
  font-weight: 700;
}
.version-select {
  min-width: 230px;
  padding: 8px 10px;
  outline: none;
}
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px;
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
  gap: 16px;
  align-items: stretch;
}
.panel,
.entry-section,
.empty-state {
  background: rgba(18, 22, 31, 0.86);
  border: 1px solid rgba(45, 53, 72, 0.72);
  border-radius: 8px;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
}
.panel { padding: 18px; }
.version-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.version-id {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  padding: 5px 9px;
  border: 1px solid rgba(96, 165, 250, 0.38);
  border-radius: 6px;
  color: var(--accent);
  font-family: "JetBrains Mono", Consolas, monospace;
  font-weight: 800;
}
.status {
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 800;
  color: #071016;
}
.status.planned { color: var(--text); }
.version-title {
  font-size: 1.4rem;
  line-height: 1.25;
  margin-bottom: 10px;
}
.desc {
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.7;
}
.meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.meta {
  background: rgba(26, 31, 46, 0.72);
  border: 1px solid rgba(45, 53, 72, 0.7);
  border-radius: 6px;
  padding: 10px;
}
.meta-label {
  color: var(--dim);
  font-size: 0.7rem;
  margin-bottom: 6px;
}
.meta-value {
  color: var(--text);
  font-size: 0.84rem;
  overflow-wrap: anywhere;
}
.sections {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.entry-section {
  padding: 16px;
}
.entry-section.full {
  grid-column: 1 / -1;
}
.entry-section h2 {
  font-size: 0.96rem;
  margin-bottom: 12px;
}
.item-list {
  display: grid;
  gap: 8px;
}
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px;
  background: rgba(26, 31, 46, 0.68);
  border: 1px solid rgba(45, 53, 72, 0.68);
  border-radius: 6px;
}
.file-kind {
  flex: 0 0 auto;
  width: 54px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
}
.file-path {
  flex: 1;
  color: var(--text);
  font-size: 0.78rem;
  font-family: Consolas, "JetBrains Mono", monospace;
  overflow-wrap: anywhere;
}
.cmd-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
}
pre {
  flex: 1;
  min-width: 0;
  padding: 10px;
  background: #080c12;
  border: 1px solid rgba(45, 53, 72, 0.9);
  border-radius: 6px;
  overflow-x: auto;
  color: #cfe3ff;
  font-size: 0.78rem;
  line-height: 1.5;
}
button.copy,
button.launch {
  min-width: 72px;
  border: 1px solid rgba(96, 165, 250, 0.48);
  background: rgba(96, 165, 250, 0.14);
  color: var(--accent);
  border-radius: 6px;
  cursor: pointer;
  font-weight: 800;
  padding: 0 10px;
}
button.copy:hover,
button.launch:hover:not(:disabled) {
  background: rgba(96, 165, 250, 0.24);
  color: var(--text);
}
button.launch {
  border-color: rgba(52, 211, 153, 0.5);
  background: rgba(52, 211, 153, 0.14);
  color: var(--done);
}
button.launch:disabled {
  border-color: rgba(107, 122, 150, 0.45);
  background: rgba(107, 122, 150, 0.12);
  color: var(--muted);
  cursor: not-allowed;
}
.empty-state {
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.note {
  margin-top: 12px;
  color: var(--dim);
  font-size: 0.76rem;
  line-height: 1.6;
}
.launcher-status {
  margin-top: 16px;
  padding: 10px 12px;
  border: 1px solid rgba(96, 165, 250, 0.25);
  border-radius: 6px;
  background: rgba(96, 165, 250, 0.08);
  color: var(--muted);
  font-size: 0.78rem;
}
.launcher-status.ready {
  border-color: rgba(52, 211, 153, 0.35);
  background: rgba(52, 211, 153, 0.08);
  color: var(--done);
}
.launcher-status.offline {
  border-color: rgba(251, 191, 36, 0.35);
  background: rgba(251, 191, 36, 0.08);
  color: var(--next);
}
@media (max-width: 820px) {
  header { flex-wrap: wrap; }
  .version-select { width: 100%; }
  .hero,
  .sections,
  .meta-grid { grid-template-columns: 1fr; }

</style>
</head>

function statusLabel(status) {
  return STATUS_LABELS[status] || status || '未知';
}

function passiveLabel(passive) {
  return PASSIVE_LABELS[passive] || passive || '未知';
}

function phaseLabel(phase) {
  return PHASE_LABELS[phase] || `第 ${phase} 阶段`;
}

function phaseTitle(phase) {
  return PHASE_TITLE_LABELS[phase] || '';
}

function versionTitle(version) {
  return VERSION_TITLE_LABELS[version.id] || version.title;
}

function getVersionFolder(version) {
  const entry = MUJOCO_ENTRIES[version.id];
  return entry?.folder || FOLDER_OVERRIDES[version.id] || version.folder || '';
}

function htmlEscape(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function filePathFor(folder, file = '') {
  return `${ROOT}\\${folder}${file ? `\\${file.replaceAll('/', '\\')}` : ''}`;
}

function commandFor(folder, file) {
  return `cd ${ROOT}\npython .\\${folder}\\${file.replaceAll('/', '\\')}`;
}

function setLauncherStatus(message, state = '') {
  const status = document.getElementById('launcher-status');
  if (!status) return;
  status.className = `launcher-status ${state}`.trim();
  status.textContent = message;
}

async function checkLauncher() {
  if (location.protocol === 'file:') {
    launcherReady = false;
    setLauncherStatus('直接启动需要通过本地启动器访问：py -3 dashboard\\launcher.py --port 8765', 'offline');
    return;
  }

  try {
    const response = await fetch('/api/health', { cache: 'no-store' });
    const data = await response.json();
    launcherReady = Boolean(response.ok && data.ok);
  } catch {
    launcherReady = false;
  }

  if (launcherReady) {
    setLauncherStatus('本地启动器已连接，可以直接启动查看/仿真脚本。', 'ready');
  } else {
    setLauncherStatus('当前是普通静态服务，直接启动不可用；请运行 py -3 dashboard\\launcher.py --port 8765。', 'offline');
  }

  document.querySelectorAll('button.launch').forEach(button => {
    button.disabled = !launcherReady;
    button.textContent = launcherReady ? '直接启动' : '启动器未连接';
  });
}

function renderFileList(title, kind, files, folder) {
  if (!files || files.length === 0) return '';
  return `
    <section class="entry-section">
      <h2>${title}</h2>
      <div class="item-list">
        ${files.map(file => `
          <div class="file-item">
            <div class="file-kind">${kind}</div>
            <span class="file-path">${htmlEscape(filePathFor(folder, file))}</span>
            <button class="copy" data-copy="${htmlEscape(filePathFor(folder, file))}" data-copy-label="复制路径">复制路径</button>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderCommandList(files, folder, versionId) {
  if (!files || files.length === 0) return '';
  return `
    <section class="entry-section full">
      <h2>启动入口</h2>
      <div class="item-list">
        ${files.map(file => {
          const command = commandFor(folder, file);
          return `
            <div class="cmd-row">
              <pre>${htmlEscape(command)}</pre>
              <button class="launch" data-version="${htmlEscape(versionId)}" data-script="${htmlEscape(file)}" disabled>启动器未连接</button>
              <button class="copy" data-copy="${htmlEscape(command)}" data-copy-label="复制">复制</button>
            </div>
          `;
        }).join('')}
      </div>
      <div class="note">直接启动需要使用本地启动器服务；普通静态页面仍可复制 PowerShell 命令手动运行。</div>
    </section>
  `;
}

  ];
  const statusClass = version.status === 'planned' ? 'planned' : '';
  const statusColor = STATUS_COLORS[version.status] || STATUS_COLORS.planned;

  root.innerHTML = `
    <div class="hero">
      <section class="panel">
        <div class="version-row">
          <div class="version-id">${version.id}</div>
          <div class="status ${statusClass}" style="background:${statusColor};">${statusLabel(version.status)}</div>
        </div>
        <div class="version-title">${htmlEscape(versionTitle(version))}</div>
        <p class="desc">${htmlEscape(version.desc)}</p>
        <div class="launcher-status" id="launcher-status">正在检查本地启动器...</div>
      </section>

      <section class="panel">
        <div class="meta-grid">
          <div class="meta">
            <div class="meta-label">阶段</div>
            <div class="meta-value">${phaseLabel(version.phase)} · ${phaseTitle(version.phase)}</div>
          </div>
          <div class="meta">
            <div class="meta-label">被动性</div>
            <div class="meta-value">${passiveLabel(version.passive)}</div>
          </div>
          <div class="meta">
            <div class="meta-label">日期</div>
            <div class="meta-value">${htmlEscape(version.date)}</div>
          </div>
          <div class="meta">
            <div class="meta-label">目录</div>
            <div class="meta-value">${folder ? htmlEscape(filePathFor(folder)) : '暂无目录'}</div>
          </div>
        </div>
      </section>
    </div>

    ${folder && (runnable.length || entry.render?.length || entry.models?.length) ? `
      <div class="sections">
        ${renderFileList('查看脚本', '查看', entry.view, folder)}
        ${renderFileList('仿真脚本', '仿真', entry.simulate, folder)}
        ${renderFileList('渲染/报告脚本', '渲染', entry.render, folder)}
        ${renderFileList('MuJoCo XML 模型', '模型', entry.models, folder)}
        ${renderCommandList(runnable, folder, version.id)}
      </div>
    ` : `
      <div class="empty-state">
        该版本暂无可直接启动的 MuJoCo 入口。
        ${folder ? `<div class="note">已识别目录：${htmlEscape(folder)}，但没有登记可直接启动的查看或仿真脚本。</div>` : ''}
      </div>
    `}
  `;

  document.querySelectorAll('button.copy').forEach(button => {
    button.addEventListener('click', async () => {
      const value = button.dataset.copy || '';
      const label = button.dataset.copyLabel || '复制';
      try {
        await navigator.clipboard.writeText(value);
        button.textContent = '已复制';
        setTimeout(() => button.textContent = label, 1200);
      } catch {
        button.textContent = '手动复制';
        setTimeout(() => button.textContent = label, 1200);
      }
    });
  });

  document.querySelectorAll('button.launch').forEach(button => {
    button.addEventListener('click', async () => {
      if (!launcherReady) return;
      const original = button.textContent;
      button.disabled = true;
      button.textContent = '启动中...';
      try {
        const response = await fetch('/api/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: button.dataset.version,
            script: button.dataset.script
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '启动失败');
        button.textContent = `已启动 ${data.pid}`;
        setLauncherStatus(`已启动 ${button.dataset.version}：${button.dataset.script}（PID ${data.pid}）`, 'ready');
        setTimeout(() => {
          button.disabled = false;
          button.textContent = '直接启动';
        }, 1800);
      } catch (error) {
        button.textContent = '启动失败';
        setLauncherStatus(error.message || '启动失败', 'offline');
        setTimeout(() => {
          button.disabled = false;
          button.textContent = original;
        }, 1800);
      }
    });
  });

  checkLauncher();
}

function renderMissing(id) {
  document.getElementById('page-root').innerHTML = `
    <div class="empty-state">
      未找到版本 ${htmlEscape(id || '')}。请从右上角选择一个版本，或返回看板重新进入。
    </div>
  `;
}

function initVersionSelect(activeId) {
  const select = document.getElementById('version-select');
  select.innerHTML = VERSIONS
    .map(v => `<option value="${v.id}">${v.id} - ${htmlEscape(versionTitle(v))}</option>`)
    .join('');
  select.value = activeId;
  select.addEventListener('change', () => {
    window.location.href = `mujoco.html?id=${encodeURIComponent(select.value)}&ui=launcher`;
  });
}

const params = new URLSearchParams(window.location.search);
const requestedId = params.get('id') || VERSIONS[0]?.id;
const version = VERSIONS.find(v => v.id === requestedId);
initVersionSelect(version?.id || VERSIONS[0]?.id);

if (version) {
  renderPage(version);
} else {
  renderMissing(requestedId);
}
</script>
</body>
</html>
