[pytest]
# pytest 配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出设置
addopts =
    -v
    --strict-markers
    --tb=short
    --durations=10
    -ra

# 标记定义
markers =
    unit: 单元测试（快速，无依赖）
    regression: 回归测试（仿真，较慢）
    integration: 集成测试
    slow: 慢速测试（>5秒）

# 覆盖率设置
[coverage:run]
source = common
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv-*/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = tests/htmlcov
