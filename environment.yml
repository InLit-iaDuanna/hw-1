# hw-1 项目 Conda 环境配置
# ==========================================
#
# 使用说明：
#   创建环境: conda env create -f environment.yml
#   更新环境: conda env update -f environment.yml --prune
#   激活环境: conda activate hw-1
#   删除环境: conda env remove -n hw-1
#
# 注意事项：
# - 本配置文件适用于 Conda/Miniconda/Mamba
# - Windows 11 系统已测试通过
# - Python 版本固定为 3.10（与 .venv-mujoco 保持一致）
# - MuJoCo 等 Python 包通过 pip 安装以获得最新版本
# ==========================================

name: hw-1

channels:
  - conda-forge
  - defaults

dependencies:
  # Python 解释器（固定版本）
  - python=3.10.11

  # 系统依赖
  - pip>=23.0
  - setuptools>=68.0
  - wheel>=0.40.0

  # 数值计算基础（通过 conda 安装以获得优化的 BLAS/LAPACK）
  - numpy>=2.0.0
  - scipy>=1.10.0

  # 可视化工具
  - matplotlib>=3.8.0
  - pillow>=10.0.0
  - seaborn>=0.12.0

  # 数据分析
  - pandas>=2.0.0

  # 开发工具
  - ipython>=8.12.0
  - jupyter>=1.0.0
  - notebook>=7.0.0

  # 代码质量工具
  - black>=24.0.0
  - ruff>=0.4.0
  - mypy>=1.10.0

  # 版本控制
  - git>=2.40.0

  # 通过 pip 安装的包（conda-forge 中不可用或版本较旧）
  - pip:
      # MuJoCo 物理引擎（必须从 PyPI 安装）
      - mujoco>=3.3.7

      # 图像/视频处理
      - imageio>=2.30.0
      - imageio-ffmpeg>=0.6.0

      # 可视化增强
      - plotly>=5.17.0

      # 数据分析
      - pyyaml>=6.0

      # 参数优化（可选）
      - cma>=3.2.2
      - deap>=1.3.1
      - joblib>=1.3.0
      - pymoo>=0.6.0
      - salib>=1.4.7
      - scikit-optimize>=0.9.0

      # UI 工具（可选）
      - streamlit>=1.28.0

      # 测试框架
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - pytest-timeout>=2.1.0
      - pytest-xdist>=3.3.0
      - pytest-benchmark>=4.0.0

      # 安全工具
      - safety>=3.0.0
      - bandit>=1.7.0
      - pip-audit>=2.6.0

      # 文档工具
      - pdoc>=14.0.0

      # Git hooks
      - pre-commit>=3.5.0

      # 类型存根
      - types-setuptools>=69.0.0
      - types-pyyaml>=6.0.0

# 环境变量配置
variables:
  HW1_PROJECT_ROOT: "D:\\Dunna\\Documents\\hw-1"
  MUJOCO_GL: "egl"
  PYTHONIOENCODING: "utf-8"
  MPLBACKEND: "TkAgg"
