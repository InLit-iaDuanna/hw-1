[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-1"
version = "1.0.0"
description = "步态训练辅助设备仿真研究 - 被动动态步行与准被动仿生机构"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "段泽琪", email = "2024211317@buct.edu.cn"}
]
keywords = ["passive dynamic walking", "compass gait", "biomimetic", "MuJoCo", "rehabilitation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Robotics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # 核心仿真依赖
    "mujoco>=3.3.7",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.6.0",

    # 可视化依赖
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "plotly>=5.17.0",
    "seaborn>=0.12.0",

    # 数据分析依赖
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 测试工具
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
]

# 开发工具
dev = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "types-setuptools>=69.0.0",
    "types-pyyaml>=6.0.0",
]

# 参数优化工具
optimization = [
    "cma>=3.2.2",
    "deap>=1.3.1",
    "joblib>=1.3.0",
    "pymoo>=0.6.0",
    "salib>=1.4.7",
    "scikit-learn>=1.3.0",
    "scikit-optimize>=0.9.0",
]

# UI 工具
ui = [
    "streamlit>=1.28.0",
]

# 安全工具
security = [
    "safety>=3.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
]

# 文档工具
docs = [
    "pdoc>=14.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

# 性能分析工具
profiling = [
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
    "py-spy>=0.3.14",
]

# 完整安装（所有可选依赖）
all = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "cma>=3.2.2",
    "deap>=1.3.1",
    "joblib>=1.3.0",
    "pymoo>=0.6.0",
    "salib>=1.4.7",
    "scikit-learn>=1.3.0",
    "scikit-optimize>=0.9.0",
    "streamlit>=1.28.0",
    "safety>=3.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
    "pdoc>=14.0.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
    "py-spy>=0.3.14",
    "types-setuptools>=69.0.0",
    "types-pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/your-repo/hw-1"
Documentation = "https://github.com/your-repo/hw-1/docs"
Repository = "https://github.com/your-repo/hw-1"
Issues = "https://github.com/your-repo/hw-1/issues"

[project.scripts]
hw1-benchmark = "benchmarks.benchmark_runner:main"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv-mujoco
  | \.venv-codex
  | __pycache__
  | build
  | dist
  | matlab-v01-v13-gait
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [
    ".venv-mujoco",
    ".venv-codex",
    "__pycache__",
    "matlab-v01-v13-gait",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (black handles this)
    "B008",   # do not perform function call in argument defaults
    "B027",   # empty method in abstract base class (可选回调方法)
    "N802",   # function name should be lowercase (保留部分驼峰命名)
    "N806",   # variable in function should be lowercase (保留数学变量如 J, N)
    "N815",   # variable in class scope should not be mixedCase (物理量标准命名)
    "SIM108", # use ternary operator (可读性优先)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are OK

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # MuJoCo API 返回 Any，暂时禁用
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式类型检查
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # 避免与类型存根冲突
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "mujoco.*",
    "matplotlib.*",
    "numpy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["common"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
