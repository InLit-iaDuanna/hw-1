# GitHub Actions 工作流 - 性能基准
name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每周日 00:00 UTC 运行完整基准
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史用于对比

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyyaml

    - name: Cache benchmark results
      uses: actions/cache@v4
      with:
        path: benchmarks/results
        key: benchmark-results-${{ github.sha }}
        restore-keys: |
          benchmark-results-

    - name: Run performance benchmarks
      run: |
        python benchmarks/benchmark_runner.py --output ci_benchmark_${{ github.sha }}.json

    - name: Compare with baseline
      id: compare
      continue-on-error: true
      run: |
        # 查找上一次基准结果
        $baseline = Get-ChildItem benchmarks/results -Filter "ci_benchmark_*.json" |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -Skip 1 -First 1

        if ($baseline) {
          Write-Output "Found baseline: $($baseline.Name)"
          # 这里可以添加对比逻辑
        } else {
          Write-Output "No baseline found, this is the first run"
        }

    - name: Generate benchmark report
      run: |
        $latest = Get-ChildItem benchmarks/results -Filter "*.json" |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
        python benchmarks/benchmark_runner.py --load $latest.Name

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          benchmarks/results/*.json
          benchmarks/results/*.png
          benchmarks/results/*.txt

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'benchmarks/results/benchmark_report.txt';

          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            const body = '## Performance Benchmark Results\n\n```\n' + report + '\n```';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }
