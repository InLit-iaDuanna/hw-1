# GitHub Actions 工作流 - 自动发布
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build twine

    - name: Run full CI pipeline
      run: |
        powershell -ExecutionPolicy Bypass -File ci/run_all_ci.ps1 -GenerateDocs

    - name: Run full benchmark suite
      run: |
        python benchmarks/benchmark_runner.py --output release_benchmark.json

    - name: Generate release notes
      id: release_notes
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { $matches[1] } else { "${{ github.event.inputs.version }}" }

        # 获取上一个 tag
        $previousTag = git describe --abbrev=0 --tags HEAD^ 2>$null

        $notes = @"
        # Release $version

        ## Changes
        $(if ($previousTag) {
          git log --pretty=format:"- %s" "$previousTag..HEAD"
        } else {
          "Initial release"
        })

        ## Test Results
        - All tests passing
        - Code coverage: See CI artifacts

        ## Benchmark Results
        - See release_benchmark.json in artifacts

        ## Installation
        ``````bash
        git clone https://github.com/your-repo/hw-1.git
        cd hw-1
        git checkout $version
        python -m venv .venv-mujoco
        .venv-mujoco\Scripts\pip install -r requirements.txt
        ``````
        "@

        $notes | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
        Write-Output $notes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: RELEASE_NOTES.md
        files: |
          benchmarks/results/release_benchmark.json
          benchmarks/results/*.png
          htmlcov/**
          docs/**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Archive release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          benchmarks/results/
          htmlcov/
          docs/
          RELEASE_NOTES.md
