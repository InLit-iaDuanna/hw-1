# GitHub Actions 工作流 - 依赖安全检查
name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每周一 00:00 UTC 运行
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  security:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit pip-audit

    - name: Check for known vulnerabilities with Safety
      continue-on-error: true
      run: |
        pip install -r requirements.txt
        safety check --json --output safety-report.json || true
        safety check || echo "Safety check found issues"

    - name: Audit dependencies with pip-audit
      continue-on-error: true
      run: |
        pip-audit --desc --format json --output pip-audit-report.json || true
        pip-audit --desc || echo "Pip-audit found issues"

    - name: Security check with Bandit
      continue-on-error: true
      run: |
        bandit -r common/ -f json -o bandit-report.json || true
        bandit -r common/ -ll || echo "Bandit found issues"

    - name: Generate security summary
      if: always()
      shell: pwsh
      run: |
        $summary = @"
        # Security Scan Summary

        ## Dependency Vulnerabilities
        $(if (Test-Path safety-report.json) { "See safety-report.json" } else { "No report generated" })

        ## Code Security Issues
        $(if (Test-Path bandit-report.json) { "See bandit-report.json" } else { "No report generated" })

        ## Audit Results
        $(if (Test-Path pip-audit-report.json) { "See pip-audit-report.json" } else { "No report generated" })
        "@

        Write-Output $summary
        $summary | Out-File -FilePath security-summary.md -Encoding utf8

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          pip-audit-report.json
          security-summary.md

    - name: Comment PR with security issues
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');

          if (fs.existsSync('security-summary.md')) {
            const summary = fs.readFileSync('security-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }
