# GitHub Actions 工作流 - 项目健康检查
name: Health Check

on:
  schedule:
    # 每周一、三、五 00:00 UTC 运行
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov radon

    - name: Check test coverage
      id: coverage
      run: |
        pytest --cov=common --cov-report=json --cov-report=term
        $coverage = (Get-Content coverage.json | ConvertFrom-Json).totals.percent_covered
        Write-Output "coverage=$coverage" >> $env:GITHUB_OUTPUT
        Write-Output "Current test coverage: $coverage%"

    - name: Check code complexity
      id: complexity
      run: |
        $output = radon cc common/ -s --total-average --json | ConvertFrom-Json
        # 计算平均复杂度
        Write-Output "Code complexity check completed"

    - name: Count TODO/FIXME/HACK comments
      id: todos
      shell: pwsh
      run: |
        $todoCount = (Select-String -Path "common/*.py" -Pattern "TODO|FIXME|HACK" -Recursive).Count
        Write-Output "todo_count=$todoCount" >> $env:GITHUB_OUTPUT
        Write-Output "Found $todoCount TODO/FIXME/HACK comments"

    - name: Check documentation freshness
      shell: pwsh
      run: |
        $readmeAge = (Get-Date) - (Get-Item README.md).LastWriteTime
        Write-Output "README.md last updated $($readmeAge.Days) days ago"

        if ($readmeAge.Days -gt 30) {
          Write-Output "::warning::README.md hasn't been updated in over 30 days"
        }

    - name: Generate health report
      shell: pwsh
      run: |
        $coverage = "${{ steps.coverage.outputs.coverage }}"
        $todoCount = "${{ steps.todos.outputs.todo_count }}"

        $report = @"
        # Project Health Report - $(Get-Date -Format 'yyyy-MM-dd')

        ## Test Coverage
        - Current: $coverage%
        - Target: 80%
        - Status: $(if ([double]$coverage -ge 80) { '✓ PASS' } else { '⚠ BELOW TARGET' })

        ## Technical Debt
        - TODO/FIXME/HACK comments: $todoCount

        ## Recommendations
        $(if ([double]$coverage -lt 80) { "- Improve test coverage to reach 80% target" } else { "" })
        $(if ([int]$todoCount -gt 50) { "- Address technical debt (TODO/FIXME comments)" } else { "" })
        "@

        Write-Output $report
        $report | Out-File -FilePath health-report.md -Encoding utf8

    - name: Upload health report
      uses: actions/upload-artifact@v4
      with:
        name: health-report-${{ github.run_number }}
        path: health-report.md

    - name: Create issue if health degraded
      if: steps.coverage.outputs.coverage < 70
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('health-report.md', 'utf8');

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '项目健康警告：测试覆盖率低于 70%',
            body: report,
            labels: ['health', 'coverage', 'automated']
          });
