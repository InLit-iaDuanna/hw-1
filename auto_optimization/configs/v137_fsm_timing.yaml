# V13.7 FSM 相位时长优化
# 目标：优化 FSM 各相位的时长参数以最大化前进距离

version: "v13_7_refactored"

# 参数定义
parameters:
  - name: "stance_early_duration"
    type: "continuous"
    bounds: [0.10, 0.30]
    default: 0.20
    description: "支撑早期相位时长 (s)"

  - name: "stance_late_duration"
    type: "continuous"
    bounds: [0.10, 0.30]
    default: 0.18
    description: "支撑晚期相位时长 (s)"

  - name: "swing_thrust_duration"
    type: "continuous"
    bounds: [0.05, 0.20]
    default: 0.12
    description: "摆动推进相位时长 (s)"

  - name: "swing_retract_duration"
    type: "continuous"
    bounds: [0.05, 0.20]
    default: 0.15
    description: "摆动回收相位时长 (s)"

# 目标函数
objective:
  type: "maximize_distance"

# 优化器配置
optimizer: "bayesian"
budget: 50  # 最大评估次数
n_initial_points: 10  # 贝叶斯优化初始随机点数

# 遗传算法配置（如果选择 genetic）
population_size: 30
n_generations: 20

# 网格搜索配置（如果选择 grid）
n_points_per_dim: 5
